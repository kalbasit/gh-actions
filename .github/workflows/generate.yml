name: Generate

# Reusable workflow that regenerates language-specific dependency hashes (Nix vendorHash
# today; Python/Rust/... in the future) and auto-commits the result. Source repos:
# this combines and generalizes the `generate` jobs from kalbasit/{ncps,swm,signal-api-receiver}.
#
# Design notes:
#   - The `languages` input is a JSON-encoded object keyed by language (today: "go" only).
#   - Skipped on fork PRs (no GHA_PAT_TOKEN access).
#   - One auto-commit per run regardless of how many languages/packages changed.

on:
  workflow_call:
    inputs:
      cachix_cache:
        description: "Cachix cache name"
        required: true
        type: string
      languages:
        description: |
          JSON object keyed by language. Each language's config carries an explicit
          list of targets, where each target names a Nix attribute path and the file
          containing its `vendorHash = "...";` line. Example:
            {"go":{"targets":[
              {"attr":"foo","file":"nix/packages/foo/default.nix"},
              {"attr":"checks.x86_64-linux.bar","file":"nix/checks/flake-module.nix"}
            ]}}
          Recognized keys (today): "go". Unknown keys fail the workflow.
        required: true
        type: string
      extra_filters:
        description: |
          Additional dorny/paths-filter rules merged into the built-in language filters,
          as a JSON object: {"filter_name":["path1","path2"]}.
        required: false
        type: string
        default: "{}"
    secrets:
      cachix_auth_token:
        description: "Cachix push token"
        required: true
      gha_pat_token:
        description: "PAT used to push the auto-commit back to the consumer's branch"
        required: true

# NOTE: GITHUB_TOKEN gets `contents: read`. The actual write (the auto-commit push) is
# performed by `stefanzweifel/git-auto-commit-action` using the PAT supplied in the
# `actions/checkout` step (`secrets.gha_pat_token`). Declaring `contents: write` here
# would force every consumer's caller to also declare `contents: write` at the workflow
# level — even consumers that never push from CI directly. The PAT path is what the
# source repos (ncps, swm, signal-api-receiver) have always used, and it has the side
# benefit that PAT-pushed commits re-trigger downstream workflows (GITHUB_TOKEN-pushed
# commits do not).
permissions:
  contents: read

jobs:
  generate:
    # Skip on fork PRs: we have no PAT to push back to the fork's branch.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-24.04
    steps:
      # NOTE: persist-credentials is intentionally left at its default (true). The PAT
      # supplied via `token:` is embedded into the git remote URL so the
      # `stefanzweifel/git-auto-commit-action` step at the bottom of this job can push
      # back. Setting `persist-credentials: false` here would break the auto-commit.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.gha_pat_token }}
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Validate languages input
        env:
          LANGUAGES_JSON: ${{ inputs.languages }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # Recognized language keys. Add new ones here when adding language modules below.
          known=(go)

          mapfile -t keys < <(echo "$LANGUAGES_JSON" | jq -r 'keys[]')

          for key in "${keys[@]}"; do
            found=false
            for k in "${known[@]}"; do
              if [[ "$key" == "$k" ]]; then
                found=true
                break
              fi
            done
            if [[ "$found" != "true" ]]; then
              echo "::error::Unknown language: $key"
              exit 1
            fi
          done

          # Validate per-language targets shape. Every enabled language must have a
          # non-empty `targets` array; each entry must be an object with exactly the
          # keys `attr` and `file`, both non-empty strings. We let typos in `attr`
          # surface later as legible `nix build` errors — only shape is checked here.
          for key in "${keys[@]}"; do
            # Validate the type of `targets` explicitly so non-array values surface as
            # our intended error message rather than a raw jq stack trace.
            targets_type="$(echo "$LANGUAGES_JSON" | jq -r --arg k "$key" '.[$k].targets | if . == null then "null" else type end')"
            if [[ "$targets_type" == "null" ]]; then
              echo "::error::languages.${key}.targets is missing"
              exit 1
            fi
            if [[ "$targets_type" != "array" ]]; then
              echo "::error::languages.${key}.targets must be a non-empty array (got $targets_type)"
              exit 1
            fi
            count="$(echo "$LANGUAGES_JSON" | jq --arg k "$key" '.[$k].targets | length')"
            if [[ "$count" -eq 0 ]]; then
              echo "::error::languages.${key}.targets must be a non-empty array"
              exit 1
            fi

            # Reject entries that aren't {attr, file} objects with non-empty string values.
            bad="$(echo "$LANGUAGES_JSON" | jq -r --arg k "$key" '
              .[$k].targets
              | to_entries[]
              | select(
                  (.value | type) != "object"
                  or (.value | keys | sort) != ["attr","file"]
                  or (.value.attr | type) != "string" or (.value.attr | length) == 0
                  or (.value.file | type) != "string" or (.value.file | length) == 0
                )
              | "languages.\($k).targets[\(.key)]: " + (.value | tojson)
            ')"
            if [[ -n "$bad" ]]; then
              while IFS= read -r line; do
                echo "::error::$line is not a valid {attr,file} target"
              done <<< "$bad"
              exit 1
            fi
          done

      - name: Build paths-filter config
        id: filter_config
        env:
          EXTRA_FILTERS_JSON: ${{ inputs.extra_filters }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # Built-in language filters. Keep keys aligned with the language modules below
          # (each `<lang>_deps` is read by the matching `if:` on its step).
          builtin='{
            "go_deps": ["**/go.mod", "**/go.sum"]
          }'

          merged="$(jq -n --argjson a "$builtin" --argjson b "$EXTRA_FILTERS_JSON" '$a * $b')"

          # Render as the YAML-ish multiline format dorny/paths-filter expects.
          {
            echo 'filters<<EOF'
            echo "$merged" | jq -r 'to_entries | map("\(.key):\n" + (.value | map("  - \"" + . + "\"") | join("\n"))) | join("\n")'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: ${{ steps.filter_config.outputs.filters }}

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ inputs.cachix_cache }}
          authToken: ${{ secrets.cachix_auth_token }}

      # ---- Language module: Go ----------------------------------------------------------
      - name: Update Go vendor hashes
        if: fromJson(inputs.languages).go != null && steps.filter.outputs.go_deps == 'true'
        env:
          GO_TARGETS_JSON: ${{ toJson(fromJson(inputs.languages).go.targets) }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # Skip if no root go.mod — multi-module repos (e.g. all modules in subdirs)
          # rely on Renovate keeping each module's go.sum current.
          if [[ -f go.mod ]]; then
            go mod tidy
          fi

          # Extract `attr` and `file` per entry with a single jq invocation per run
          # (tab-delimited so file paths with spaces still parse). File paths with
          # literal tabs are not supported.
          while IFS=$'\t' read -r attr file; do
            set +e
            nix build --print-build-logs ".#${attr}.goModules" 2> /tmp/log
            ret=$?
            set -e

            if [[ "$ret" -eq 0 ]]; then
              # Verify by rebuilding — catches hashes that happen to match a cached store path
              # but would not match a fresh build.
              set +e
              nix build --print-build-logs ".#${attr}.goModules" --rebuild 2> /tmp/log
              ret=$?
              set -e
            fi

            if [[ "$ret" -eq 0 ]]; then
              echo "::notice::Hash is up to date for $attr"
              continue
            fi

            hash="$(grep 'got:' /tmp/log | awk '{print $2}')"
            echo "hash=$hash for $attr"

            if [[ -z "$hash" ]]; then
              cat /tmp/log
              echo "::error::hash is empty for $attr"
              exit 1
            fi

            # Safety: refuse to sed-replace when the target file contains more than one
            # `vendorHash` line. With explicit per-target files, two targets pointed at
            # the same file would otherwise clobber each other on every run. Files with
            # multiple Go modules need to be split, or this workflow needs a smarter
            # block-scoped rewrite (out of scope today).
            matches="$(grep -c '^[[:space:]]*vendorHash[[:space:]]*=' "$file" || true)"
            if [[ "$matches" -ne 1 ]]; then
              echo "::error::Expected exactly one vendorHash line in $file for target $attr, found $matches"
              exit 1
            fi

            sed -e "s#vendorHash =.*\$#vendorHash = \"${hash}\";#" -i "$file"
          done < <(printf '%s\n' "$GO_TARGETS_JSON" | jq -r '.[] | "\(.attr)\t\(.file)"')
      # ---- End language modules ---------------------------------------------------------

      - name: Show diff
        run: git diff

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update vendor hashes"
