name: CI

# Top-level reusable orchestrator. Consumers wire their own pull_request / push /
# workflow_dispatch triggers in a thin caller and invoke this via:
#
#   jobs:
#     ci:
#       uses: kalbasit/gh-actions/.github/workflows/ci.yml@<ref>
#       with: { ... }
#       secrets: { ... }
#
# See README.md for the full input/secret contract and consumer examples.

on:
  workflow_call:
    inputs:
      cachix_cache:
        description: "Cachix cache name"
        required: true
        type: string
      languages:
        description: |
          JSON object keyed by language. Each language's value declares an explicit
          list of targets, where each target names a Nix attribute path and the file
          holding its dependency hash. Example:
            {"go":{"targets":[{"attr":"foo","file":"nix/packages/foo/default.nix"}]}}
        required: true
        type: string
      oci:
        description: "Enable the OCI image build/push pipeline"
        required: false
        type: boolean
        default: false
      systems:
        description: 'Nix systems to build/check, as a JSON array. Defaults to ["x86_64-linux","aarch64-linux"].'
        required: false
        type: string
        default: '["x86_64-linux","aarch64-linux"]'
      test_systems:
        description: |
          Subset of `systems` (JSON array) on which to run the integration suite
          (`nix flake check`) and coverage. The empty array (default) — or an empty
          string — runs them on every system. Forwarded to build.yml and applied to
          the standalone flake-check job; the OCI image is still built for every
          system. Example: ["x86_64-linux"].
        required: false
        type: string
        default: "[]"
      check_mode:
        description: |
          How `nix flake check` runs. One of:
            - single (default): one monolithic `nix flake check -L` per system —
              the standalone flake-check job when oci:false, or the inline check
              inside build.yml when oci:true. Good for quick repos.
            - matrix: enumerate `.#checks.<system>` and fan each check out into its
              own parallel job (system × check, scoped by test_systems). Good for
              large projects.
            - none: skip inline checks entirely. OCI image build/push unaffected.
          Any other value fails the workflow up-front.
        required: false
        type: string
        default: single
      coverage:
        description: |
          When true, run a fork-safe coverage job that builds
          `.#<primary_package>.coverage` and uploads it to Codecov. Requires
          `primary_package` and the `codecov_token` secret. Skipped on fork PRs.
          Default false.
        required: false
        type: boolean
        default: false
      primary_package:
        description: "Primary Nix package attr (required when oci: true). Used for coverage and version.txt."
        required: false
        type: string
        default: ""
      dockerhub_image:
        description: "Docker Hub image base name (e.g. user/foo). Empty disables Docker Hub."
        required: false
        type: string
        default: ""
      dockerhub_username:
        description: "Docker Hub username. Pair with dockerhub_image to enable Docker Hub."
        required: false
        type: string
        default: ""
      ghcr_enabled:
        description: "Push images to a GitHub Container Registry image."
        required: false
        type: boolean
        default: true
      ghcr_image:
        description: "Optional override for the ghcr.io image base (default: ghcr.io/<repo>)."
        required: false
        type: string
        default: ""
      push_oci:
        description: "Push OCI images to registries. Forced false on fork PRs."
        required: false
        type: boolean
        default: true
      openspec_path:
        description: "Path to the openspec changes directory."
        required: false
        type: string
        default: openspec/changes
      extra_filters:
        description: 'Additional dorny/paths-filter rules merged with the built-in language filters, e.g. {"docs":["docs/**"]}.'
        required: false
        type: string
        default: "{}"
    secrets:
      cachix_auth_token:
        description: "Cachix push token"
        required: true
      gha_pat_token:
        description: "PAT for git-auto-commit-action (required when generate runs)"
        required: false
      codecov_token:
        description: "Codecov token (required when oci: true)"
        required: false
      dockerhub_token:
        description: "Docker Hub registry credential (required when Docker Hub is enabled)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  filter:
    runs-on: ubuntu-24.04
    outputs:
      go_deps: ${{ steps.filter.outputs.go_deps }}
      any_deps: ${{ steps.any.outputs.any_deps }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Build paths-filter config
        id: filter_config
        env:
          EXTRA_FILTERS_JSON: ${{ inputs.extra_filters }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          builtin='{
            "go_deps": ["**/go.mod", "**/go.sum"]
          }'

          merged="$(jq -n --argjson a "$builtin" --argjson b "$EXTRA_FILTERS_JSON" '$a * $b')"

          {
            echo 'filters<<EOF'
            echo "$merged" | jq -r 'to_entries | map("\(.key):\n" + (.value | map("  - \"" + . + "\"") | join("\n"))) | join("\n")'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: ${{ steps.filter_config.outputs.filters }}

      - name: Compute any_deps
        id: any
        env:
          GO_DEPS: ${{ steps.filter.outputs.go_deps }}
        run: |
          if [[ "$GO_DEPS" == "true" ]]; then
            echo "any_deps=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_deps=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: filter
    # Skip on fork PRs (no PAT to push back) and when no language dep paths changed.
    if: |
      needs.filter.outputs.any_deps == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false))
    uses: ./.github/workflows/generate.yml
    with:
      cachix_cache: ${{ inputs.cachix_cache }}
      languages: ${{ inputs.languages }}
      extra_filters: ${{ inputs.extra_filters }}
    secrets:
      cachix_auth_token: ${{ secrets.cachix_auth_token }}
      gha_pat_token: ${{ secrets.gha_pat_token }}

  check-mode-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate check_mode
        env:
          CHECK_MODE: ${{ inputs.check_mode }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          case "$CHECK_MODE" in
            single | matrix | none) ;;
            *)
              echo "::error::check_mode must be one of single, matrix, none (got: $CHECK_MODE)"
              exit 1
              ;;
          esac

  flake-check:
    needs: check-mode-guard
    if: ${{ inputs.oci == false && inputs.check_mode == 'single' }}
    strategy:
      matrix:
        system: ${{ fromJson(inputs.systems) }}
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # main
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ inputs.cachix_cache }}
          authToken: ${{ secrets.cachix_auth_token }}
      - name: Flake check
        if: inputs.test_systems == '' || inputs.test_systems == '[]' || contains(fromJson(inputs.test_systems), matrix.system)
        run: nix flake check -L

  # ---- Matrix mode: fan each flake check out into its own parallel job -------------
  # `check-matrix` enumerates `.#checks.<system>` for every effective system
  # (test_systems when non-empty, else all systems) and emits a single matrix
  # `include` list of {system, check} objects. `checks` then builds each check on its
  # own runner. Lives here (not in build.yml) so it works for oci:false too; when
  # oci:true the OCI image still builds per-arch in build.yml alongside this fan-out.
  check-matrix:
    needs: check-mode-guard
    if: ${{ inputs.check_mode == 'matrix' }}
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.enumerate.outputs.include }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ inputs.cachix_cache }}
          authToken: ${{ secrets.cachix_auth_token }}
      - name: Enumerate checks
        id: enumerate
        env:
          SYSTEMS_JSON: ${{ inputs.systems }}
          TEST_SYSTEMS_JSON: ${{ inputs.test_systems }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          # Effective systems: test_systems when non-empty, otherwise every system.
          effective="$TEST_SYSTEMS_JSON"
          if [[ -z "$effective" || "$effective" == "[]" ]]; then
            effective="$SYSTEMS_JSON"
          fi

          include='[]'
          while IFS= read -r system; do
            # A flake without a `checks.<system>` attribute yields an empty list
            # (matrix mode is then a no-op for that system) rather than erroring.
            checks="$(nix eval ".#checks.${system}" --apply builtins.attrNames --json 2>/dev/null || echo '[]')"
            include="$(jq -c --arg sys "$system" --argjson checks "$checks" \
              '. + [ $checks[] | { system: $sys, check: . } ]' <<<"$include")"
          done < <(jq -r '.[]' <<<"$effective")

          echo "include=$include" >> "$GITHUB_OUTPUT"

  checks:
    needs: check-matrix
    if: ${{ inputs.check_mode == 'matrix' }}
    strategy:
      fail-fast: false
      matrix:
        # `|| '[]'` keeps the strategy valid when check-matrix is skipped or the
        # flake exposes no checks: an empty include list expands to zero jobs.
        include: ${{ fromJson(needs.check-matrix.outputs.include || '[]') }}
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ inputs.cachix_cache }}
          authToken: ${{ secrets.cachix_auth_token }}
      - name: Build check
        # Pass the matrix values via env, not direct `${{ }}` expansion into the
        # shell: on fork PRs the check names come from `builtins.attrNames` over the
        # attacker-controlled flake, so interpolating them into `run:` would be a
        # template-injection vector. Quoted env references treat them as data.
        env:
          SYSTEM: ${{ matrix.system }}
          CHECK: ${{ matrix.check }}
        run: nix build ".#checks.$SYSTEM.$CHECK" -L

  # ---- Coverage (opt-in, independent of check_mode) --------------------------------
  # Builds `.#<primary_package>.coverage` once on the primary system (first of
  # test_systems, else first of systems) and uploads to Codecov. Fork-safe: skipped
  # on fork PRs since the codecov token is withheld there.
  #
  # `needs` the cache-populating jobs so coverage runs AFTER them: a consumer's
  # `.#<pkg>.coverage` typically depends on the same test/cohort derivations those
  # jobs build and push to Cachix, so running concurrently would force coverage to
  # rebuild the whole instrumented suite from scratch (observed: ncps coverage went
  # 33s -> 6m20s when this job lost that ordering). `flake-check`/`check-matrix`/
  # `checks`/`build` are each skipped for some check_mode/oci combination, and a
  # skipped `needs` job would cascade-skip coverage by default — so the gate uses
  # `!cancelled()` (runs when deps are skipped or succeeded) while still honouring
  # the `inputs.coverage` toggle and the fork-PR skip.
  coverage:
    needs:
      - check-mode-guard
      - flake-check
      - check-matrix
      - checks
      - build
    if: >-
      ${{ !cancelled()
        && inputs.coverage
        && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
    # Primary system = first of test_systems when set, else first of systems; the
    # `&&` short-circuit keeps fromJson off an empty test_systems string.
    runs-on: ${{ ((inputs.test_systems != '' && inputs.test_systems != '[]') && fromJson(inputs.test_systems)[0] || fromJson(inputs.systems)[0]) == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ inputs.cachix_cache }}
          authToken: ${{ secrets.cachix_auth_token }}
      - name: Build coverage
        env:
          PRIMARY_PACKAGE: ${{ inputs.primary_package }}
        run: nix build ".#${PRIMARY_PACKAGE}.coverage" -L
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.codecov_token }}
          files: result-coverage

  build:
    needs: check-mode-guard
    if: ${{ inputs.oci }}
    uses: ./.github/workflows/build.yml
    with:
      systems: ${{ inputs.systems }}
      test_systems: ${{ inputs.test_systems }}
      check_mode: ${{ inputs.check_mode }}
      cachix_cache: ${{ inputs.cachix_cache }}
      primary_package: ${{ inputs.primary_package }}
      dockerhub_image: ${{ inputs.dockerhub_image }}
      dockerhub_username: ${{ inputs.dockerhub_username }}
      ghcr_enabled: ${{ inputs.ghcr_enabled }}
      ghcr_image: ${{ inputs.ghcr_image }}
      # push_oci is forced false on fork PRs regardless of the input value.
      push_oci: ${{ inputs.push_oci && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
    secrets:
      cachix_auth_token: ${{ secrets.cachix_auth_token }}
      dockerhub_token: ${{ secrets.dockerhub_token }}

  openspec-guard:
    uses: ./.github/workflows/openspec-guard.yml
    with:
      path: ${{ inputs.openspec_path }}

  ci:
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - filter
      - generate
      - check-mode-guard
      - flake-check
      - check-matrix
      - checks
      - coverage
      - build
      - openspec-guard
    steps:
      - name: Check Workflow Status
        env:
          FILTER_RESULT: ${{ needs.filter.result }}
          GENERATE_RESULT: ${{ needs.generate.result }}
          CHECK_MODE_GUARD_RESULT: ${{ needs.check-mode-guard.result }}
          FLAKE_CHECK_RESULT: ${{ needs.flake-check.result }}
          CHECK_MATRIX_RESULT: ${{ needs.check-matrix.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          OPENSPEC_GUARD_RESULT: ${{ needs.openspec-guard.result }}
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          declare -A results=(
            ["filter"]="$FILTER_RESULT"
            ["generate"]="$GENERATE_RESULT"
            ["check-mode-guard"]="$CHECK_MODE_GUARD_RESULT"
            ["flake-check"]="$FLAKE_CHECK_RESULT"
            ["check-matrix"]="$CHECK_MATRIX_RESULT"
            ["checks"]="$CHECKS_RESULT"
            ["coverage"]="$COVERAGE_RESULT"
            ["build"]="$BUILD_RESULT"
            ["openspec-guard"]="$OPENSPEC_GUARD_RESULT"
          )

          failed=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::Job '$job' ended with result: $result"
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi

          echo "All jobs passed"
