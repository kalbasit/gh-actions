name: Lint workflows

# Lints every workflow under .github/workflows/ with actionlint. Wired to
# `pull_request` so it acts as the CI gate Renovate's auto-merge depends on: when
# Renovate opens a digest-bump PR, this workflow runs and either greenlights the
# merge (auto-merge fires) or blocks it.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          # Use nixpkgs's actionlint pinned to the channel install-nix-action set up.
          # Glob is expanded by bash; pass each workflow file explicitly so actionlint
          # can resolve workflow_call references via ./.github/workflows/*.yml.
          nix run nixpkgs#actionlint -- .github/workflows/*.yml
