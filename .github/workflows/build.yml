name: Build (OCI)

# Reusable workflow that (in `single` check_mode) runs `nix flake check` inline,
# builds an OCI image, optionally pushes it to Docker Hub and/or ghcr.io, and assembles
# a multi-arch manifest. Called by ci.yml when `oci: true`. Coverage is owned by ci.yml's
# coverage job, not this workflow. Source repos: ncps/build.yml
# and signal-api-receiver/build.yml (parameterized and reconciled per the SWM-precedence
# rule).
#
# Registries are individually opt-in:
#   - Docker Hub is enabled when BOTH `dockerhub_image` and `dockerhub_username` are set.
#   - ghcr.io is enabled when `ghcr_enabled` is true (default).
# At least one registry must be enabled when `oci: true`.

on:
  workflow_call:
    inputs:
      systems:
        description: "Nix systems to build for, as a JSON array (e.g. [\"x86_64-linux\",\"aarch64-linux\"])"
        required: true
        type: string
      test_systems:
        description: |
          Subset of `systems` (JSON array) on which to run the inline integration
          suite (`nix flake check`) in `single` check_mode. The empty array
          (default) — or an empty string — runs it on every system. A non-empty list
          restricts the inline check to the listed systems; the OCI image is still
          built for every system so the multi-arch manifest stays complete.
          Example: ["x86_64-linux"].
        required: false
        type: string
        default: "[]"
      check_mode:
        description: |
          How `nix flake check` runs, forwarded by ci.yml. `single` (default) runs
          one monolithic `nix flake check -L` inline per system (scoped by
          `test_systems`). `matrix` and `none` skip the inline check — in `matrix`
          mode the checks fan out in ci.yml instead. The OCI image build/push is
          unaffected. Coverage is owned by ci.yml's coverage job, not this workflow.
        required: false
        type: string
        default: single
      cachix_cache:
        description: "Cachix cache name"
        required: true
        type: string
      primary_package:
        description: "Primary Nix package attr (used for nix/packages/<pkg>/version.txt)"
        required: true
        type: string
      dockerhub_image:
        description: "Docker Hub image base name (e.g. kalbasit/foo). When empty, Docker Hub is disabled."
        required: false
        type: string
        default: ""
      dockerhub_username:
        description: "Docker Hub username. Required (and must be paired with dockerhub_image) to enable Docker Hub."
        required: false
        type: string
        default: ""
      ghcr_enabled:
        description: "Whether to push to a GitHub Container Registry image."
        required: false
        type: boolean
        default: true
      ghcr_image:
        description: |
          Optional override for the ghcr.io image base. Empty (default) uses
          ghcr.io/<repo>. Set this to e.g. ghcr.io/someorg/foo to override; or
          set ghcr_enabled: false to disable ghcr.io entirely.
        required: false
        type: string
        default: ""
      push_oci:
        description: "Whether to push images / build the multi-arch manifest. Forced false on fork PRs by the caller."
        required: true
        type: boolean
    secrets:
      cachix_auth_token:
        description: "Cachix push token"
        required: true
      dockerhub_token:
        description: "Docker Hub registry credential. Required only when Docker Hub is enabled."
        required: false
    outputs:
      tags:
        description: "Generated OCI image tags"
        value: ${{ jobs.build.outputs.tags }}
      labels:
        description: "Generated OCI image labels"
        value: ${{ jobs.build.outputs.labels }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        system: ${{ fromJson(inputs.systems) }}
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    outputs:
      labels: ${{ steps.meta.outputs.labels }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Validate registry inputs
        env:
          OCI_PUSH: ${{ inputs.push_oci }}
          DH_IMAGE: ${{ inputs.dockerhub_image }}
          DH_USER: ${{ inputs.dockerhub_username }}
          GHCR_ENABLED: ${{ inputs.ghcr_enabled }}
        shell: bash
        run: |
          set -euo pipefail

          dh_image_set=false; [[ -n "$DH_IMAGE" ]] && dh_image_set=true
          dh_user_set=false;  [[ -n "$DH_USER"  ]] && dh_user_set=true

          # Registry inputs only matter when we'd actually push. On fork PRs the
          # caller forces push_oci=false and `dockerhub_username` is stripped (the
          # variable is withheld from forks) while `dockerhub_image` stays a
          # literal, yielding an asymmetric pair that is harmless because no
          # login/push/manifest step runs. Only enforce the pairing (and the
          # at-least-one-registry rule) when pushing.
          if [[ "$OCI_PUSH" == "true" ]]; then
            if [[ "$dh_image_set" != "$dh_user_set" ]]; then
              echo "::error::dockerhub_image and dockerhub_username must be set together (got image=$dh_image_set user=$dh_user_set)"
              exit 1
            fi
            if [[ "$dh_image_set" != "true" && "$GHCR_ENABLED" != "true" ]]; then
              echo "::error::push_oci is true but no OCI registry is enabled (set dockerhub_image+dockerhub_username and/or ghcr_enabled)"
              exit 1
            fi
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # main
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ inputs.cachix_cache }}
          authToken: ${{ secrets.cachix_auth_token }}

      - name: Create version file
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          PRIMARY_PACKAGE: ${{ inputs.primary_package }}
        run: |
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "$REF_NAME" > "nix/packages/${PRIMARY_PACKAGE}/version.txt"
          fi

      # The inline integration suite runs only in `single` check_mode AND when the
      # system is named in `test_systems` (empty array => every system). `matrix`
      # and `none` modes skip it — in `matrix` mode the checks fan out in ci.yml.
      # The OCI image build below is intentionally NOT gated: every arch still
      # builds its image so the multi-arch manifest stays complete. Coverage now
      # lives in ci.yml's coverage job, not here.
      - name: Flake check
        id: flake-check
        if: inputs.check_mode == 'single' && (inputs.test_systems == '' || inputs.test_systems == '[]' || contains(fromJson(inputs.test_systems), matrix.system))
        run: nix flake check -L

      - name: Build the OCI image
        shell: bash
        run: |
          set -euo pipefail
          nix build -L ".#packages.${{ matrix.system }}.docker"

      - name: Build the OCI image pusher
        if: inputs.push_oci
        shell: bash
        run: |
          set -euo pipefail
          nix build -L ".#packages.${{ matrix.system }}.push-docker-image"

      - name: Login to Docker Hub
        if: inputs.push_oci && inputs.dockerhub_image != '' && inputs.dockerhub_username != ''
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Login to GitHub Container Registry
        if: inputs.push_oci && inputs.ghcr_enabled
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OCI metadata images list
        if: inputs.push_oci
        id: meta-images
        env:
          DH_IMAGE: ${{ inputs.dockerhub_image }}
          GHCR_ENABLED: ${{ inputs.ghcr_enabled }}
          GHCR_IMAGE: ${{ inputs.ghcr_image }}
          GHCR_DEFAULT: ghcr.io/${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'images<<EOF'
            if [[ -n "$DH_IMAGE" ]]; then
              echo "$DH_IMAGE"
            fi
            if [[ "$GHCR_ENABLED" == "true" ]]; then
              if [[ -n "$GHCR_IMAGE" ]]; then
                echo "$GHCR_IMAGE"
              else
                echo "$GHCR_DEFAULT"
              fi
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: OCI metadata
        if: inputs.push_oci
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.meta-images.outputs.images }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha

      - name: Push the OCI image
        if: inputs.push_oci
        env:
          DOCKER_IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          ./result/bin/push-docker-image

  oci-manifest:
    if: inputs.push_oci
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Login to Docker Hub
        if: inputs.dockerhub_image != '' && inputs.dockerhub_username != ''
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Login to GitHub Container Registry
        if: inputs.ghcr_enabled
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create a multi-architecture manifest
        env:
          DOCKER_IMAGE_TAGS: ${{ needs.build.outputs.tags }}
          SYSTEMS: ${{ join(fromJson(inputs.systems), ',') }}
        shell: bash
        run: |
          for tag in $DOCKER_IMAGE_TAGS; do
            imgs=()
            for system in $( echo "$SYSTEMS" | tr ',' ' ' ); do
              imgs+=("$tag-$system")
            done

            docker manifest create "$tag" "${imgs[@]}"
          done

      - name: Push the multi-architecture manifest
        env:
          DOCKER_IMAGE_TAGS: ${{ needs.build.outputs.tags }}
        shell: bash
        run: |
          for tag in $DOCKER_IMAGE_TAGS; do
            docker manifest push "$tag"
          done
