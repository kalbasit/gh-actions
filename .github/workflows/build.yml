name: Build (OCI)

# Reusable workflow that runs `nix flake check`, builds + uploads coverage to Codecov,
# builds an OCI image, optionally pushes it to Docker Hub and/or ghcr.io, and assembles
# a multi-arch manifest. Called by ci.yml when `oci: true`. Source repos: ncps/build.yml
# and signal-api-receiver/build.yml (parameterized and reconciled per the SWM-precedence
# rule).
#
# Registries are individually opt-in:
#   - Docker Hub is enabled when BOTH `dockerhub_image` and `dockerhub_username` are set.
#   - ghcr.io is enabled when `ghcr_enabled` is true (default).
# At least one registry must be enabled when `oci: true`.

on:
  workflow_call:
    inputs:
      systems:
        description: "Nix systems to build for, as a JSON array (e.g. [\"x86_64-linux\",\"aarch64-linux\"])"
        required: true
        type: string
      test_systems:
        description: |
          Subset of `systems` (JSON array) on which to run the integration suite
          (`nix flake check`) and coverage. The empty array (default) — or an empty
          string — runs them on every system. A non-empty list restricts the
          test/coverage steps to the listed systems; the OCI image is still built
          for every system so the multi-arch manifest stays complete.
          Example: ["x86_64-linux"].
        required: false
        type: string
        default: "[]"
      run_flake_check:
        description: |
          Whether this workflow runs `nix flake check` + coverage inline. Default
          true. Set false when the consumer fans the checks out into its own
          parallel matrix (`nix build .#checks.<system>.<name>`) and runs coverage
          itself; the OCI image build/push then proceeds without an inline check.
        required: false
        type: boolean
        default: true
      cachix_cache:
        description: "Cachix cache name"
        required: true
        type: string
      primary_package:
        description: "Primary Nix package attr (used for .#<pkg>.coverage and nix/packages/<pkg>/version.txt)"
        required: true
        type: string
      dockerhub_image:
        description: "Docker Hub image base name (e.g. kalbasit/foo). When empty, Docker Hub is disabled."
        required: false
        type: string
        default: ""
      dockerhub_username:
        description: "Docker Hub username. Required (and must be paired with dockerhub_image) to enable Docker Hub."
        required: false
        type: string
        default: ""
      ghcr_enabled:
        description: "Whether to push to a GitHub Container Registry image."
        required: false
        type: boolean
        default: true
      ghcr_image:
        description: |
          Optional override for the ghcr.io image base. Empty (default) uses
          ghcr.io/<repo>. Set this to e.g. ghcr.io/someorg/foo to override; or
          set ghcr_enabled: false to disable ghcr.io entirely.
        required: false
        type: string
        default: ""
      push_oci:
        description: "Whether to push images / build the multi-arch manifest. Forced false on fork PRs by the caller."
        required: true
        type: boolean
    secrets:
      cachix_auth_token:
        description: "Cachix push token"
        required: true
      codecov_token:
        description: "Codecov token (skipped on fork PRs)"
        required: true
      dockerhub_token:
        description: "Docker Hub registry credential. Required only when Docker Hub is enabled."
        required: false
    outputs:
      tags:
        description: "Generated OCI image tags"
        value: ${{ jobs.build.outputs.tags }}
      labels:
        description: "Generated OCI image labels"
        value: ${{ jobs.build.outputs.labels }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        system: ${{ fromJson(inputs.systems) }}
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    outputs:
      labels: ${{ steps.meta.outputs.labels }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Validate registry inputs
        env:
          OCI_PUSH: ${{ inputs.push_oci }}
          DH_IMAGE: ${{ inputs.dockerhub_image }}
          DH_USER: ${{ inputs.dockerhub_username }}
          GHCR_ENABLED: ${{ inputs.ghcr_enabled }}
        shell: bash
        run: |
          set -euo pipefail

          dh_image_set=false; [[ -n "$DH_IMAGE" ]] && dh_image_set=true
          dh_user_set=false;  [[ -n "$DH_USER"  ]] && dh_user_set=true

          if [[ "$dh_image_set" != "$dh_user_set" ]]; then
            echo "::error::dockerhub_image and dockerhub_username must be set together (got image=$dh_image_set user=$dh_user_set)"
            exit 1
          fi

          # Only require at least one registry when we'd actually push.
          if [[ "$OCI_PUSH" == "true" ]]; then
            if [[ "$dh_image_set" != "true" && "$GHCR_ENABLED" != "true" ]]; then
              echo "::error::push_oci is true but no OCI registry is enabled (set dockerhub_image+dockerhub_username and/or ghcr_enabled)"
              exit 1
            fi
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: DeterminateSystems/flake-checker-action@ba1df9ab06e525ea302f2a56f5e182f33cfd14fa # main
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ${{ inputs.cachix_cache }}
          authToken: ${{ secrets.cachix_auth_token }}

      - name: Create version file
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          PRIMARY_PACKAGE: ${{ inputs.primary_package }}
        run: |
          if [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "$REF_NAME" > "nix/packages/${PRIMARY_PACKAGE}/version.txt"
          fi

      # Integration suite + coverage run only when `run_flake_check` is true AND
      # the system is named in `test_systems` (empty array => every system). The
      # OCI image build below is intentionally NOT gated: every arch still builds
      # its image so the multi-arch manifest stays complete. A consumer that fans
      # the checks out into its own matrix sets `run_flake_check: false`.
      - name: Flake check
        id: flake-check
        if: inputs.run_flake_check && (inputs.test_systems == '' || inputs.test_systems == '[]' || contains(fromJson(inputs.test_systems), matrix.system))
        run: nix flake check -L

      - name: Build coverage
        id: build-coverage
        if: inputs.run_flake_check && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && (inputs.test_systems == '' || inputs.test_systems == '[]' || contains(fromJson(inputs.test_systems), matrix.system))
        env:
          PRIMARY_PACKAGE: ${{ inputs.primary_package }}
        run: nix build ".#${PRIMARY_PACKAGE}.coverage" -L

      - name: Upload coverage reports to Codecov
        if: inputs.run_flake_check && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && (inputs.test_systems == '' || inputs.test_systems == '[]' || contains(fromJson(inputs.test_systems), matrix.system))
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          token: ${{ secrets.codecov_token }}
          files: result-coverage

      - name: Build the OCI image
        shell: bash
        run: |
          set -euo pipefail
          nix build -L ".#packages.${{ matrix.system }}.docker"

      - name: Build the OCI image pusher
        if: inputs.push_oci
        shell: bash
        run: |
          set -euo pipefail
          nix build -L ".#packages.${{ matrix.system }}.push-docker-image"

      - name: Login to Docker Hub
        if: inputs.push_oci && inputs.dockerhub_image != '' && inputs.dockerhub_username != ''
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Login to GitHub Container Registry
        if: inputs.push_oci && inputs.ghcr_enabled
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OCI metadata images list
        if: inputs.push_oci
        id: meta-images
        env:
          DH_IMAGE: ${{ inputs.dockerhub_image }}
          GHCR_ENABLED: ${{ inputs.ghcr_enabled }}
          GHCR_IMAGE: ${{ inputs.ghcr_image }}
          GHCR_DEFAULT: ghcr.io/${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'images<<EOF'
            if [[ -n "$DH_IMAGE" ]]; then
              echo "$DH_IMAGE"
            fi
            if [[ "$GHCR_ENABLED" == "true" ]]; then
              if [[ -n "$GHCR_IMAGE" ]]; then
                echo "$GHCR_IMAGE"
              else
                echo "$GHCR_DEFAULT"
              fi
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: OCI metadata
        if: inputs.push_oci
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ steps.meta-images.outputs.images }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=sha

      - name: Push the OCI image
        if: inputs.push_oci
        env:
          DOCKER_IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          ./result/bin/push-docker-image

  oci-manifest:
    if: inputs.push_oci
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Login to Docker Hub
        if: inputs.dockerhub_image != '' && inputs.dockerhub_username != ''
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ inputs.dockerhub_username }}
          password: ${{ secrets.dockerhub_token }}

      - name: Login to GitHub Container Registry
        if: inputs.ghcr_enabled
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create a multi-architecture manifest
        env:
          DOCKER_IMAGE_TAGS: ${{ needs.build.outputs.tags }}
          SYSTEMS: ${{ join(fromJson(inputs.systems), ',') }}
        shell: bash
        run: |
          for tag in $DOCKER_IMAGE_TAGS; do
            imgs=()
            for system in $( echo "$SYSTEMS" | tr ',' ' ' ); do
              imgs+=("$tag-$system")
            done

            docker manifest create "$tag" "${imgs[@]}"
          done

      - name: Push the multi-architecture manifest
        env:
          DOCKER_IMAGE_TAGS: ${{ needs.build.outputs.tags }}
        shell: bash
        run: |
          for tag in $DOCKER_IMAGE_TAGS; do
            docker manifest push "$tag"
          done
